name: Build RetroBit Office APK

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Runner image sudah punya Android SDK (ANDROID_HOME). Cukup terima lisensi
      # & pastikan platform-34 ada.
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDK dir:"; ls "$ANDROID_HOME" || true
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      # Tanpa gradle/actions/setup-gradle: hindari warning cache service & Node 20.
      # Gradle 8.6 diambil lewat wrapper (system gradle / unduh langsung saat generate).
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            if command -v gradle > /dev/null 2>&1; then
              gradle wrapper --gradle-version 8.6
            else
              curl -fsSL -o /tmp/gradle-8.6-bin.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
              unzip -q /tmp/gradle-8.6-bin.zip -d /tmp
              /tmp/gradle-8.6/bin/gradle wrapper --gradle-version 8.6
            fi
          fi
          chmod +x gradlew
          ls -lh gradle/wrapper/ || true

      - name: Build Debug APK (signed)
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build-debug.log

      - name: Build Release APK (signed)
        id: build_release
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build-release.log

      # Karena log Actions tidak bisa diambil dari lingkungan tertentu, tampilkan
      # ringkasan error sebagai annotations (terbaca via gh run view / API).
      - name: Report build errors as annotations
        if: failure()
        run: |
          cat build-debug.log build-release.log > all-build.log 2>/dev/null || true
          if [ ! -s all-build.log ]; then
            echo "::error::Tidak ada log build tercatat - kemungkinan gagal sebelum gradlew (cek step Prepare Android SDK / Generate Gradle Wrapper)"
            exit 0
          fi
          {
            echo "### Build error summary"
            echo '```'
            grep -E "^e: |error:|Could not (find|resolve)|FAILURE:|Execution failed|What went wrong" all-build.log | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|Could not (find|resolve)|Execution failed" all-build.log | head -60 | \
            sed -E 's/(.{3500}).*/\1.../' | sed 's/^/::error::/'
          awk '/What went wrong/{p=1} p{print; n++} n>15{exit}' all-build.log | head -16 | \
            sed -E 's/(.{3500}).*/\1.../' | sed 's/^/::error::/'

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: RetroBit-Office-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: RetroBit-Office-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Show APK info
        if: success()
        run: |
          ls -lh app/build/outputs/apk/debug/ || true
          ls -lh app/build/outputs/apk/release/ || true

      - name: Create GitHub Release on tag
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
